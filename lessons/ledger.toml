[concepts]
notebook-cell = "a page is made of cells; Shift + Enter runs a code cell and shows its last line's result below it"
error-message = "a red error box means Python couldn't follow an instruction; read the last line, fix, re-run"
arithmetic = "+ - * / on numbers, typed with * and / (not × ÷)"
operator-precedence = "* and / happen before + and -; parentheses go first"
power = "a ** b multiplies a by itself b times"
variable = "name = value stores a value under a name; = means store, not equals; one cell per name"
naming-rules = "you choose names: letters, digits and _, no spaces"
function = "def name(input): followed by indented steps; a named recipe"
call = "name(input) runs a function with that input and gives its answer; a function can call another"
return = "return value gives the answer back from a function"
indentation = "lines belonging to a def/for/if are pushed in 4 more spaces; the editor indents after :, Backspace un-indents"
comment = "# starts a note for humans that Python ignores"
todo-placeholder = "todo() marks code the learner still has to write"
list = "[a, b, c] holds several values in order"
builtin-len = "len(list) gives how many values a list holds"
loop = "for item in list: runs the indented lines once per value"
if = "if condition: runs the indented lines only when the condition is true"
comparison = "a > b, a < b give true or false"
mean = "the average: total divided by how many values"
builtin-zip = "zip(xs, ys) pairs up two lists position by position"
tuple = "for a, b in ...: takes two values at a time, one for each name"
builtin-print = "print(...) shows values as text under the cell, every time it runs"
chart-reading = "x-axis (bottom) measures the first number, y-axis (left) the second; each dot is one pair"
model = "a recipe with adjustable numbers that turns an input into a guess"
parameter = "a model's adjustable numbers (its knobs); learning means finding good values for them"
line = "guess = w * x + b: w is the steepness, b the starting height (the guess at x = 0)"
error = "guess minus truth; positive means too high, negative too low"
squaring = "a number times itself; never negative, and big numbers grow much bigger"
loss = "a number measuring how wrong a model is; lower is better"
mse = "mean squared error: the average of the squared errors over all examples"
update-variable = "x = x + 1: Python works out the right side with the old x, then stores the result back in x"
nudge = "a tiny change to an input (like 0.0001) to see how the output changes"
rate = "one change divided by another: how much of this per one of that"
slope = "(f(x + h) - f(x)) / h: how much the output changes per unit of input, right here; sign = direction, size = steepness"
function-as-value = "a function can be handed to another function as an input (no parentheses), and called inside it"
step-rule = "new w = w - rate * slope: the minus makes the step go downhill"
learning-rate = "the small number that sets the step size: too small is slow, too big overshoots or flies off"
builtin-range = "for i in range(n): repeats the indented lines n times"
gradient-descent = "repeat: measure the slope, take a step downhill"
expanding-square = "(x + h) x (x + h) = x x x + 2 x x x h + h x h, seen as a square cut into four pieces"
derivative = "the exact slope, as the nudge shrinks to nothing; written d/dx; d/dx(x^2) = 2x"
derivative-rules = "constant: 0; c * x: c; x * x: 2 * x; c * f: c times f's slope; f + g: slopes add"
computation-graph = "a calculation drawn as boxes (values) and arrows (which values make which), one small step per box"
local-slope = "for one arrow: how much the result moves per unit nudge of one input, everything else held still"
chain-rule = "rates along a path multiply, like chaining currency exchange rates"
blame = "a box's blame: how much the final loss moves per unit this box moves (its slope of the loss)"
backpropagation = "walk the graph backwards: blame of a box = local slope of its arrow x blame of the box it points to"
gradient = "the slopes of the loss for all the knobs together"
blames-add = "when a value feeds several arrows, the blames arriving through each arrow add up"
two-sided-product = "in a x c, nudging a moves the result by c per unit, nudging c moves it by a"
return-pair = "return a, b gives back two values; x, y = f(...) catches both"
gradient-check = "compare a hand-written gradient against nudging"
class = "class Name: a recipe for a new kind of value with named slots; Name(...) makes one"
init-and-self = "def __init__(self, ...): runs when a new value is made; self is the value being set up"
attribute = "a named slot inside a value, read and stored with a dot: v.data, v.grad = 0"
list-append = "list.append(x) adds x to the end of the list"
builtin-reversed = "for x in reversed(list): goes from the last entry to the first"
recording-book = "while a calculation runs, every step is written in a list (the book) in order"
reverse-order = "a box is written after the boxes it was made from, so reading the book backwards reaches every user of a value before the value itself"
fresh-boxes = "backward adds to blames, so every new calculation needs fresh Value boxes with blame 0"
curve-model = "guess = a * x * x + w * x + b: a curve that can rise and then fall"
centering-inputs = "measuring inputs from the middle in sensible units (like (t - 25) / 10) keeps all knobs on a similar footing"
multi-input-model = "guess = w_t × t + w_r × rain + w_k × weekend + b: one knob per input"
vector = "a list of numbers, like the knobs [12, -8, 4] or one day's inputs [17, 1, 0]"
dot-product = "multiply two vectors in pairs and add up the products: dot([1, 2], [3, 4]) = 11"
matrix = "a table of numbers: one row per example (day), one column per input"
list-of-lists = "a matrix in plain Python: rows = [[14, 0, 0], [17, 1, 0], ...]; for row in rows: gives one row at a time"
shape = "rows then columns: (8, 3); a vector of 8 numbers has shape (8,)"
numpy = "a library for maths on whole arrays, loaded as np; its tools are reached with np."
numpy-array = "np.array(list) makes a vector or matrix array; X.shape gives its shape"
elementwise = "on arrays, + - * / work position by position, and a single number works against every position; on lists, + glues"
matmul-operator = "X @ w: dot product of every row of X with w; v @ w between two vectors is their dot product"
shape-rule = "(8, 3) @ (3,) gives (8,): the inner sizes must match and disappear; otherwise a matmul error"
numpy-mean = "np.mean(array) is the mean of all its numbers"
vector-times-matrix = "v @ X: dot product of v with every column of X; (8,) @ (8, 3) gives (3,)"
vectorized-gradient = "grad_w = (2 * e) @ X / n, grad_b = np.mean(2 * e): each knob's slope is the mean of 2e times its own input"
broadcasting = "a smaller array used against every row: X - np.array([25, 0, 0]) subtracts 25 from each row's first column"
classification = "choosing one answer from a fixed list, like which digit 0–9 a picture shows"
label = "the correct answer for an example, e.g. the digit a picture really shows"
pixel = "one dot of a picture: 0 is white, 255 is black ink"
indexing = "a[0] picks the first item (counting from 0); M[i, j] picks row i, column j; M[i, j] = 1 stores there"
reshape = "A.reshape(10000, 784): the same numbers in the same order, in a new shape"
numpy-zeros = "np.zeros((784, 10)) makes an array of that shape filled with 0"
matrix-times-matrix = "A @ B: every row of A dotted with every column of B; (n, 784) @ (784, 10) gives (n, 10)"
argmax = "np.argmax(v) is the position of the largest number; with axis=1, one per row"
axis = "axis=1 works across each row (one result per row); axis=0 down each column"
comparing-arrays = "a == b compares position by position, giving True/False; np.mean counts True as 1"
accuracy = "the share of examples the model gets right"
test-set = "examples kept aside and never trained on, to measure honestly"
exp = "e^s (np.exp): e ≈ 2.718 to the power s; always positive, keeps order, e^(a+b) = e^a × e^b"
softmax = "e^s divided by the row's total: scores become shares (probabilities) that add up to 1"
softmax-shift = "subtracting a row's largest score before e^ leaves the shares unchanged and avoids overflow"
keepdims = "keepdims=True keeps a column shape (n, 1), which broadcasts across each row"
log = "log undoes e^: log(e^a) = a; log 1 = 0; log(x / y) = log x − log y"
surprise = "−log p of the right answer's share: 0 when sure and right, large when sure and wrong"
cross-entropy = "the mean surprise over all examples: the loss for classification"
one-hot = "a row with a 1 at the right answer's position and 0 elsewhere"
exp-slope = "the slope of e^x is e^x itself (that is why e is chosen)"
log-slope = "the slope of log x is 1 / x"
softmax-gradient = "the slope of the surprise for each score is p − 1 for the right answer and p for the others: p − y"
transpose = "X.T swaps rows and columns; X.T @ G gives the slope of every knob in W"
numpy-sum = "np.sum(A, axis=0) adds down each column; axis=1 across each row"
model-capacity = "a single weighted sum per answer can't express 'this or that'; training longer doesn't fix it"
relu = "relu(z) = z when z > 0, else 0: np.maximum(Z, 0)"
piecewise-line = "a line plus ReLU pieces bends where you choose; enough bends follow any shape"
hidden-layer = "H = relu(X @ W1 + b1): detectors in between input and scores"
neural-network = "layers of weighted sums with bends: X → H → scores"
matmul-grouping = "(X @ W1) @ W2 = X @ (W1 @ W2): two layers without a bend equal one"
random-generator = "rng = np.random.default_rng(0); rng.normal(0, 0.05, shape): seeded random numbers around 0"
random-init = "networks start from small random knobs, not zeros"
input-gradient = "dH = G @ W2.T: a value feeding many scores collects their blames"
relu-slope = "ReLU passes blame where z > 0 (slope 1) and blocks it elsewhere (slope 0)"
boolean-mask = "multiplying by Z > 0 counts True as 1 and False as 0"
two-layer-backprop = "G, dW2 = H.T @ G, dH = G @ W2.T, dZ = dH * (Z > 0), dW1 = X.T @ dZ"
variance = "mean of (number − mean)²: how spread out numbers are"
typical-size = "the square root of the variance (or of the mean square, for numbers centred on 0)"
numpy-sqrt = "np.sqrt(9) is 3: the number that times itself gives 9"
zero-init-symmetry = "all-zero knobs make every detector identical forever, and block all blame to W1"
variances-add = "the variance of a sum of independent random parts is the sum of their variances"
he-init = "start knobs with typical size √(2 / n) for n inputs, so values keep their size through ReLU layers"
vanishing-exploding = "too small a start fades values to 0 through layers; too big explodes them"
mini-batch = "a slope from a random batch of examples: a cheap, rough estimate of the full slope"
epoch = "one pass through all the batches"
permutation = "rng.permutation(n) gives 0 … n−1 in random order"
range-step = "range(0, n, size) counts from 0 in jumps of size; range(1, 501) counts 1 … 500"
slicing = "a[start:stop] gives positions start … stop−1"
index-array = "X[[3, 0, 7]] picks rows 3, 0 and 7"
argument-unpacking = "f(X, *knobs) passes the items of knobs as separate inputs"
momentum = "velocity = 0.9 × velocity + slope; knob −= rate × velocity"
moving-average = "an average that keeps adding new values while fading old ones"
adam = "divide each knob's averaged slope by the root of its averaged squared slope: one pace for every knob"
bias-correction = "dividing by 1 − 0.9^t (and 1 − 0.999^t) undoes the zero start of the averages"
overfitting = "perfect on training data, worse on new data: the model memorised"
weight-decay = "add decay × knob to every slope (a penalty on big knobs) so knobs shrink unless the data needs them"
numpy-eye = "np.eye(10) is the 10 × 10 table with 1s on the diagonal; np.eye(10)[labels] gives one-hot rows"
numpy-abs = "np.abs makes every number positive"
library = "a toolbox of code other people wrote and tested, like NumPy and PyTorch"
tensor = "PyTorch's array: torch.tensor([...]) has a shape and works with @, *, .T, slices"
bits-and-precision = "numbers are stored in a fixed number of bits: 32 keeps about 7 digits, 64 about 16"
dtype = "the kind of number stored: torch.float32, torch.float64, torch.long; @ won't mix them"
dim = "PyTorch's word for NumPy's axis: torch.sum(A, dim=1)"
requires-grad = "requires_grad=True marks a tensor as a knob: keep the books on everything made from it"
torch-backward = "loss.backward() reads the book in reverse order and fills in .grad on every knob"
item = "x.item() turns a one-number tensor into a plain Python number"
grads-accumulate = "backward() adds to .grad, so old blame must be cleared before each step"
fresh-forward = "each backward needs a fresh forward pass: PyTorch throws the book away after using it"
torch-relu = "torch.relu(Z): the bend, for tensors"
torch-cross-entropy = "F.cross_entropy(S, labels): cross-entropy from raw scores and whole-number labels"
list-comprehension = "[f(k) for k in items] builds a list by running the expression once per item"
numpy-from-tensor = "t.numpy() turns a tensor into a NumPy array; torch.tensor(a) goes the other way"
builtin-max = "max(a, b) is the larger of two numbers"
nn-linear = "nn.Linear(784, 64): a layer holding weights (64, 784) and biases; layer(X) computes X @ W.T + b"
manual-seed = "torch.manual_seed(0) makes PyTorch's random numbers repeatable"
nn-sequential = "nn.Sequential(a, b, c): each layer's output is the next one's input"
parameters = "model.parameters() goes through a model's knobs; p.numel() counts the numbers in one"
optimizer = "an object holding the knobs and a step rule: torch.optim.Adam(model.parameters(), lr=0.001)"
detach = "t.detach() gives the same numbers without the book"
training-loop = "clear, forward, backward, step: optimizer.zero_grad(), loss.backward(), optimizer.step()"
randperm = "torch.randperm(n) is rng.permutation(n) for tensors"
float-method = ".float() turns True/False values into 1s and 0s with a point"
no-grad = "with torch.no_grad(): runs the indented lines without keeping the books"
gpu = "a processor with thousands of simple workers, well suited to matrix products"
device = "where tensors live; everything in one calculation must be on the same device"
pytorch = "the library most of the field uses for training networks; import torch"
translation-problem = "a flat network ties each knob to one spot, so it must learn a shape again at every position"
rng-integers = "rng.integers(0, n) gives a random whole number from 0 up to, not including, n"
two-way-slice = "M[r:r + 3, c:c + 3] is a 3 × 3 square of M"
kernel = "a small grid of knobs that slides over a picture"
convolution = "at every position, the dot product of the kernel with the patch under it"
convolution-output-size = "a kernel of size k gives h − k + 1 rows for a picture of height h"
feature-map = "the output of a convolution: a map of where a shape was found"
numpy-roll = "np.roll(a, 3, axis=1) shifts an array 3 columns along"
knob-sharing = "the same few knobs are reused at every position, so what's learned anywhere works everywhere"
