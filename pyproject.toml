[project]
name = "learn-llm"
version = "0.1.0"
description = "Understand modern AI by building it. One unbroken, hands-on path from your first line of Python to training and serving your own language model, with every idea derived and every line of code your own."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSE-CONTENT"]
requires-python = ">=3.12"
dependencies = [
    "marimo>=0.25.2",
    "numpy>=2.5",
    # No wheels for Intel Macs: there the course still starts, and chapters 00-08 work.
    "torch>=2.8; sys_platform != 'darwin' or platform_machine == 'arm64'",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
]

# CPU builds on Linux and Windows: the default ones bring several GB of GPU libraries.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["learn_llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Course-wide marimo settings: run every lesson as soon as it opens, save the learner's edits.
[tool.marimo.runtime]
auto_instantiate = true
on_cell_change = "autorun"

# Results show under the code that made them, as the lessons describe.
[tool.marimo.display]
cell_output = "below"
# The course's own look (fonts, text, callouts) on every page.
custom_css = ["learn_llm/course.css"]

[tool.marimo.save]
autosave = "after_delay"
